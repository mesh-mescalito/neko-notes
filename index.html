<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#21808d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🐱 ネコノート - Cat Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --color-bg-primary:#fcfcf9; --color-bg-secondary:#ffffff; --color-text-primary:#13343b; --color-text-secondary:#626c71; --color-border:rgba(94,82,64,.2); --color-teal:#21808d; --color-teal-hover:#1d7480; }
        @media (prefers-color-scheme: dark) { :root { --color-bg-primary:#1f2121; --color-bg-secondary:#262828; --color-text-primary:#f5f5f5; --color-text-secondary:#a7a9a9; --color-border:rgba(119,124,124,.3); --color-teal:#32b8c6; --color-teal-hover:#2da6b2; } }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Press Start 2P','Courier New',monospace; background:var(--color-bg-primary); color:var(--color-text-primary); image-rendering:pixelated; }
        .container { max-width:800px; margin:0 auto; padding:20px; }
        .header { text-align:center; margin-bottom:30px; position:relative; }
        .ascii-cat { font-size:.7rem; line-height:1.2; margin-bottom:15px; white-space:pre; animation:catWiggle 3s ease-in-out infinite; }
        @keyframes catWiggle { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
        .header h1 { font-size:1.5rem; margin-bottom:10px; text-shadow:4px 4px 0 rgba(0,0,0,.2); letter-spacing:2px; }
        .floating-paw { position:absolute; font-size:2rem; animation:float 3s ease-in-out infinite; opacity:.3; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
        .paw-1{top:0;left:10%}.paw-2{top:20px;right:10%;animation-delay:1s}.paw-3{bottom:0;left:20%;animation-delay:2s}
        .mode-selector { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:30px; }
        .mode-btn { padding:12px 18px; border:4px solid var(--color-border); background:var(--color-bg-secondary); color:var(--color-text-primary); cursor:pointer; font-size:.8rem; box-shadow:4px 4px 0 rgba(0,0,0,.2); }
        .mode-btn:hover,.mode-btn:active { border-color:var(--color-teal); transform:translate(-2px,-2px); box-shadow:6px 6px 0 rgba(0,0,0,.3); }
        .mode-btn.active { background:var(--color-teal); color:#fff; border-color:var(--color-teal); }
        .mode-content { display:none; animation:fadeIn .3s; }.mode-content.active { display:block; } @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        #writeArea,.edit-mode textarea { width:100%; padding:20px; border:4px solid var(--color-border); background:var(--color-bg-secondary); color:var(--color-text-primary); font:.8rem/1.8 'Press Start 2P',monospace; resize:vertical; }
        #writeArea { min-height:260px; }.edit-mode textarea{min-height:100px;font-size:.75rem;padding:15px;background:var(--color-bg-primary)}
        #writeArea:focus,.edit-mode textarea:focus,.new-category-form input:focus { outline:none; border-color:var(--color-teal); }
        .btn { padding:12px 18px; background:var(--color-teal); color:#fff; border:4px solid var(--color-text-primary); cursor:pointer; font:.7rem 'Press Start 2P',monospace; margin-top:15px; box-shadow:4px 4px 0 rgba(0,0,0,.3); }
        .btn:hover,.btn:active { background:var(--color-teal-hover); transform:translate(-2px,-2px); box-shadow:6px 6px 0 rgba(0,0,0,.4); }.btn-secondary { background:var(--color-bg-secondary); color:var(--color-text-primary); border:2px solid var(--color-border); }.btn-small{padding:8px 12px;font-size:.7rem}
        .note-card { background:var(--color-bg-secondary); border:4px solid var(--color-border); padding:20px; margin-bottom:20px; box-shadow:6px 6px 0 rgba(0,0,0,.2); }
        .note-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.note-timestamp{font-size:.6rem;color:var(--color-text-secondary)}.note-category{padding:6px 10px;font-size:.6rem;border:2px solid rgba(0,0,0,.3)}.note-text{line-height:1.8;white-space:pre-wrap;word-wrap:break-word;font-size:.75rem}
        .category-selector,.backup-actions,.note-actions,.edit-controls,.classify-controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; }.backup-actions{justify-content:center;margin:0 0 20px}
        .category-chip { padding:8px 12px; border:3px solid transparent; cursor:pointer; font-size:.7rem; box-shadow:3px 3px 0 rgba(0,0,0,.2); }.category-chip.selected{border-color:var(--color-text-primary);border-width:4px}.category-chip:hover,.category-chip:active{transform:translate(-2px,-2px)}
        .new-category-form { display:flex; gap:10px; margin-top:15px; align-items:center; }.new-category-form input { flex:1; min-width:0; padding:10px; border:4px solid var(--color-border); background:var(--color-bg-secondary); color:var(--color-text-primary); font:.75rem 'Press Start 2P',monospace; }.color-picker{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.color-option{width:40px;height:40px;cursor:pointer;border:3px solid transparent;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
        .notes-list{max-height:600px;overflow-y:auto}.empty-state{text-align:center;padding:60px 20px;color:var(--color-text-secondary)}.empty-state h3{margin-bottom:10px}.filter-section{margin-bottom:30px}.filter-section h3{margin-bottom:15px}.stats{text-align:center;margin-bottom:20px;color:var(--color-text-secondary)}
        .import-note { font-size:.62rem; line-height:1.6; color:var(--color-text-secondary); text-align:center; max-width:58ch; margin:0 auto 18px; }
        @media(max-width:480px){.container{padding:14px}.mode-btn{font-size:.68rem;padding:11px 10px}.header h1{font-size:1.1rem}.btn{font-size:.62rem}.note-card{padding:14px}.new-category-form{align-items:stretch}.new-category-form input{font-size:.65rem}}
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <div class="floating-paw paw-1">🐾</div><div class="floating-paw paw-2">🐾</div><div class="floating-paw paw-3">🐾</div>
        <div class="ascii-cat">  /\_/\
 ( o.o )
  &gt; ^ &lt;</div>
        <h1>🐱 ネコノート 🐾</h1>
        <p style="font-size:.9rem;color:var(--color-text-secondary);margin-top:5px;">Cat Notes • 猫のメモ</p>
    </header>

    <nav class="mode-selector" aria-label="Modos de notas">
        <button class="mode-btn active" data-mode="write">🐈 書く</button>
        <button class="mode-btn" data-mode="classify">🏷️ 分類</button>
        <button class="mode-btn" data-mode="explore">🎲 探索</button>
        <button class="mode-btn" data-mode="all">📋 全て</button>
        <button class="mode-btn" data-mode="manage">✏️ 編集一覧</button>
    </nav>

    <main>
        <section id="writeMode" class="mode-content active">
            <textarea id="writeArea" placeholder="にゃー... 書いてください 🐾"></textarea>
            <div class="category-selector" id="writeCategorySelector"></div>
            <button class="btn" onclick="saveNote()">🐾 保存 SAVE</button>
        </section>

        <section id="classifyMode" class="mode-content">
            <div class="stats"><p style="font-size:.7rem;">🐈 未分類 Sin clasificar: <strong id="unclassifiedCount">0</strong></p></div>
            <div id="classifyCard"></div>
        </section>

        <section id="exploreMode" class="mode-content">
            <div class="filter-section">
                <h3 style="font-size:.9rem;">🐱 カテゴリー選択</h3>
                <div id="exploreCategories" class="category-selector"></div>
                <button class="btn" onclick="loadRandomNote()">🎲 ランダム RANDOM</button>
            </div>
            <div id="exploreCard"></div>
        </section>

        <section id="allMode" class="mode-content">
            <div class="stats"><p style="font-size:.7rem;">📋 合計 Total: <strong id="totalCount">0</strong></p></div>
            <div class="notes-list" id="allNotesList"></div>
        </section>

        <section id="manageMode" class="mode-content">
            <div class="stats"><p style="font-size:.7rem;">✏️ Editar todas: <strong id="manageCount">0</strong></p></div>
            <div class="backup-actions">
                <button class="btn btn-small" onclick="exportNotes()">📤 Exportar</button>
                <button class="btn btn-small btn-secondary" onclick="document.getElementById('importFile').click()">📥 Importar</button>
                <input type="file" id="importFile" accept="application/json,.json" hidden onchange="importNotes(event)">
            </div>
            <p class="import-note">Exporta en el móvil viejo, envía el archivo <strong>neko-notes-backup.json</strong> al móvil nuevo e impórtalo aquí.</p>
            <div class="notes-list" id="manageNotesList"></div>
        </section>
    </main>
</div>

<script>
let notes = JSON.parse(localStorage.getItem('quickNotes') || '[]');
let categories = JSON.parse(localStorage.getItem('quickCategories') || '[]');
let currentClassifyIndex = 0;
let selectedWriteCategory = null;
const selectedExploreCategories = new Set();
const colors = ['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef','#ec4899','#f43f5e'];

function saveToStorage(){ localStorage.setItem('quickNotes',JSON.stringify(notes)); localStorage.setItem('quickCategories',JSON.stringify(categories)); }
function escapeHtml(value){ return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
function safeId(value){ return String(value).replace(/[^a-zA-Z0-9_-]/g,'_'); }
function makeNoteId(){ return Date.now() + '-' + Math.random().toString(16).slice(2); }

function saveNote(){
    const text=document.getElementById('writeArea').value.trim();
    if(!text) return;
    notes.push({id:makeNoteId(),text,timestamp:new Date().toISOString(),category:selectedWriteCategory||null});
    saveToStorage();
    document.getElementById('writeArea').value='';
    selectedWriteCategory=null;
    renderCategories();
    alert('🐾 にゃー！Nota guardada');
}

function switchMode(mode){
    document.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode));
    document.querySelectorAll('.mode-content').forEach(content=>content.classList.remove('active'));
    document.getElementById(mode+'Mode').classList.add('active');
    if(mode==='classify') loadClassifyMode();
    if(mode==='explore') loadExploreMode();
    if(mode==='all') loadAllNotes();
    if(mode==='manage') loadManageMode();
    if(mode==='write') renderCategories();
}

function renderCategories(){
    const selector=document.getElementById('categorySelector');
    if(selector){ selector.innerHTML=categories.map(cat=>`<button class="category-chip" style="background:${cat.color};color:white;" onclick="assignCategory(${JSON.stringify(cat.name)})">${escapeHtml(cat.name)}</button>`).join(''); }
    const writeSelector=document.getElementById('writeCategorySelector');
    if(writeSelector){ writeSelector.innerHTML=categories.map(cat=>`<button class="category-chip ${selectedWriteCategory===cat.name?'selected':''}" style="background:${cat.color};color:white;" onclick="selectWriteCategory(${JSON.stringify(cat.name)})">${escapeHtml(cat.name)}</button>`).join(''); }
}
function selectWriteCategory(categoryName){ selectedWriteCategory=selectedWriteCategory===categoryName?null:categoryName; renderCategories(); }

function loadClassifyMode(){
    const unclassified=notes.filter(n=>!n.category);
    document.getElementById('unclassifiedCount').textContent=unclassified.length;
    if(!unclassified.length){ document.getElementById('classifyCard').innerHTML='<div class="empty-state"><h3 style="font-size:.9rem;">🐱 完璧！Todo clasificado</h3><p style="font-size:.7rem;">にゃー 🐾</p></div>'; return; }
    currentClassifyIndex=Math.floor(Math.random()*unclassified.length);
    const note=unclassified[currentClassifyIndex], id=safeId(note.id);
    document.getElementById('classifyCard').innerHTML=`<article class="note-card"><div class="note-header"><span class="note-timestamp">${formatDate(note.timestamp)}</span></div><div class="note-text" id="noteText${id}">${escapeHtml(note.text)}</div><div class="note-actions"><button class="btn btn-small btn-secondary" onclick="editNoteInClassify(${JSON.stringify(note.id)})">✏️ 編集</button><button class="btn btn-small btn-secondary" onclick="deleteNote(${JSON.stringify(note.id)},'classify')">🗑️ 削除</button></div><div id="editArea${id}"></div><div class="category-selector" id="categorySelector"></div><div class="new-category-form"><input type="text" id="newCategoryName" placeholder="新カテゴリー..."><button class="btn" onclick="showColorPicker()">+</button></div><div id="colorPicker" style="display:none"><div class="color-picker">${colors.map(color=>`<button class="color-option" aria-label="Elegir color" style="background:${color}" onclick="createCategory('${color}')"></button>`).join('')}</div></div><div class="classify-controls"><button class="btn btn-secondary" onclick="loadClassifyMode()">⏭️ スキップ</button></div></article>`;
    renderCategories();
}
function assignCategory(categoryName){ const unclassified=notes.filter(n=>!n.category); const note=unclassified[currentClassifyIndex]; if(!note)return; note.category=categoryName; saveToStorage(); loadClassifyMode(); }
function showColorPicker(){const picker=document.getElementById('colorPicker');picker.style.display=picker.style.display==='none'?'block':'none';}
function createCategory(color){const input=document.getElementById('newCategoryName'); const name=input.value.trim(); if(!name)return; if(categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){alert('Esta categoría ya existe');return;} categories.push({name,color});saveToStorage();input.value='';document.getElementById('colorPicker').style.display='none';renderCategories();}

function editNoteInClassify(noteId){ openEdit(noteId,'editArea','noteText','editText','saveEdit','cancelEdit'); }
function saveEdit(noteId){ saveTextEdit(noteId,'editText',()=>loadClassifyMode()); }
function cancelEdit(noteId){ cancelTextEdit(noteId,'editArea','noteText'); }

function loadExploreMode(){
    const target=document.getElementById('exploreCategories');
    target.innerHTML=categories.map(cat=>`<button class="category-chip ${selectedExploreCategories.has(cat.name)?'selected':''}" style="background:${cat.color};color:white;" onclick="toggleExploreCategory(${JSON.stringify(cat.name)},this)">${escapeHtml(cat.name)}</button>`).join('');
    document.getElementById('exploreCard').innerHTML='';
}
function toggleExploreCategory(name,element){if(selectedExploreCategories.has(name)){selectedExploreCategories.delete(name);element.classList.remove('selected')}else{selectedExploreCategories.add(name);element.classList.add('selected')}}
function loadRandomNote(){
    if(!selectedExploreCategories.size){alert('Selecciona al menos una categoría');return;}
    const filtered=notes.filter(n=>selectedExploreCategories.has(n.category));
    if(!filtered.length){document.getElementById('exploreCard').innerHTML='<div class="empty-state"><p style="font-size:.75rem;">🐾 にゃー... No hay notas</p></div>';return;}
    const note=filtered[Math.floor(Math.random()*filtered.length)], category=categories.find(c=>c.name===note.category), id=safeId(note.id);
    document.getElementById('exploreCard').innerHTML=`<article class="note-card"><div class="note-header"><span class="note-timestamp">${formatDate(note.timestamp)}</span><span class="note-category" style="background:${category?category.color:'var(--color-text-secondary)'};color:#fff;">${escapeHtml(note.category||'未分類')}</span></div><div class="note-text" id="exploreNoteText${id}">${escapeHtml(note.text)}</div><div class="note-actions"><button class="btn btn-small btn-secondary" onclick="editNoteInExplore(${JSON.stringify(note.id)})">✏️ 編集</button></div><div id="exploreEditArea${id}"></div></article>`;
}
function editNoteInExplore(noteId){openEdit(noteId,'exploreEditArea','exploreNoteText','exploreEditText','saveExploreEdit','cancelExploreEdit')}
function saveExploreEdit(noteId){saveTextEdit(noteId,'exploreEditText',()=>loadRandomNote())}
function cancelExploreEdit(noteId){cancelTextEdit(noteId,'exploreEditArea','exploreNoteText')}

function loadAllNotes(){
    document.getElementById('totalCount').textContent=notes.length;
    const target=document.getElementById('allNotesList');
    if(!notes.length){target.innerHTML='<div class="empty-state"><h3 style="font-size:.9rem;">🐱 ノートなし</h3><p style="font-size:.7rem;">にゃー... 書いて！🐾</p></div>';return;}
    target.innerHTML=sortedNotes().map(note=>noteCardReadOnly(note)).join('');
}
function noteCardReadOnly(note){ const category=note.category?categories.find(c=>c.name===note.category):null; return `<article class="note-card"><div class="note-header"><span class="note-timestamp">${formatDate(note.timestamp)}</span><span class="note-category" style="background:${category?category.color:'var(--color-text-secondary)'};color:#fff;">${escapeHtml(note.category||'未分類')}</span></div><div class="note-text">${escapeHtml(note.text)}</div></article>`; }
function sortedNotes(){return [...notes].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));}

function loadManageMode(){
    document.getElementById('manageCount').textContent=notes.length;
    const target=document.getElementById('manageNotesList');
    if(!notes.length){target.innerHTML='<div class="empty-state"><h3 style="font-size:.9rem;">🐱 ノートなし</h3><p style="font-size:.7rem;">にゃー... 書いて！🐾</p></div>';return;}
    target.innerHTML=sortedNotes().map(note=>{
        const category=note.category?categories.find(c=>c.name===note.category):null, id=safeId(note.id);
        const chips=`${categories.map(cat=>`<button class="category-chip ${note.category===cat.name?'selected':''}" style="background:${cat.color};color:white;" onclick="assignCategoryToNote(${JSON.stringify(note.id)},${JSON.stringify(cat.name)})">${escapeHtml(cat.name)}</button>`).join('')}<button class="category-chip ${!note.category?'selected':''}" style="background:var(--color-text-secondary);color:white;" onclick="clearCategoryFromNote(${JSON.stringify(note.id)})">Sin categoría</button>`;
        return `<article class="note-card"><div class="note-header"><span class="note-timestamp">${formatDate(note.timestamp)}</span><span class="note-category" style="background:${category?category.color:'var(--color-text-secondary)'};color:#fff;">${escapeHtml(note.category||'未分類')}</span></div><div class="note-text" id="manageNoteText${id}">${escapeHtml(note.text)}</div><div class="note-actions"><button class="btn btn-small btn-secondary" onclick="editNoteInManage(${JSON.stringify(note.id)})">✏️ 編集</button><button class="btn btn-small btn-secondary" onclick="deleteNote(${JSON.stringify(note.id)},'manage')">🗑️ 削除</button></div><div id="manageEditArea${id}"></div><div class="category-selector">${chips}</div></article>`;
    }).join('');
}
function assignCategoryToNote(noteId,categoryName){const note=notes.find(n=>String(n.id)===String(noteId));if(!note)return;note.category=categoryName;saveToStorage();loadManageMode()}
function clearCategoryFromNote(noteId){const note=notes.find(n=>String(n.id)===String(noteId));if(!note)return;note.category=null;saveToStorage();loadManageMode()}
function editNoteInManage(noteId){openEdit(noteId,'manageEditArea','manageNoteText','manageEditText','saveManageEdit','cancelManageEdit')}
function saveManageEdit(noteId){saveTextEdit(noteId,'manageEditText',()=>loadManageMode())}
function cancelManageEdit(noteId){cancelTextEdit(noteId,'manageEditArea','manageNoteText')}

function openEdit(noteId,areaPrefix,textPrefix,inputPrefix,saveFn,cancelFn){
    const note=notes.find(n=>String(n.id)===String(noteId));if(!note)return;const id=safeId(note.id),area=document.getElementById(areaPrefix+id),text=document.getElementById(textPrefix+id); if(!area||!text)return;
    area.innerHTML=`<div class="edit-mode"><textarea id="${inputPrefix}${id}">${escapeHtml(note.text)}</textarea><div class="edit-controls"><button class="btn btn-small" onclick="${saveFn}(${JSON.stringify(note.id)})">💾 保存</button><button class="btn btn-small btn-secondary" onclick="${cancelFn}(${JSON.stringify(note.id)})">❌ 戻る</button></div></div>`;text.style.display='none';
}
function saveTextEdit(noteId,inputPrefix,afterSave){const note=notes.find(n=>String(n.id)===String(noteId));if(!note)return;const input=document.getElementById(inputPrefix+safeId(note.id));if(!input)return;const text=input.value.trim();if(!text){alert('La nota no puede estar vacía');return;}note.text=text;saveToStorage();afterSave()}
function cancelTextEdit(noteId,areaPrefix,textPrefix){const note=notes.find(n=>String(n.id)===String(noteId));if(!note)return;const id=safeId(note.id);document.getElementById(areaPrefix+id).innerHTML='';document.getElementById(textPrefix+id).style.display='block'}
function deleteNote(noteId,origin){if(!confirm('🐱 にゃー？ ¿Eliminar esta nota?'))return;notes=notes.filter(n=>String(n.id)!==String(noteId));saveToStorage();origin==='manage'?loadManageMode():loadClassifyMode()}

function exportNotes(){
    const backup={app:'Neko Notes',version:1,exportedAt:new Date().toISOString(),notes,categories};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='neko-notes-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function normalizeImportedNote(item){
    if(!item||typeof item.text!=='string')return null;
    return {id:item.id??makeNoteId(),text:item.text,timestamp:item.timestamp&& !Number.isNaN(new Date(item.timestamp).getTime())?item.timestamp:new Date().toISOString(),category:typeof item.category==='string'?item.category:null};
}
function noteFingerprint(note){return `${note.text}\u0000${note.timestamp}\u0000${note.category||''}`}
function importNotes(event){
    const file=event.target.files&&event.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=({target})=>{
        try{
            const data=JSON.parse(target.result);
            if(!data||!Array.isArray(data.notes)||!Array.isArray(data.categories))throw new Error('Formato inválido');
            const importedNotes=data.notes.map(normalizeImportedNote).filter(Boolean);
            const importedCategories=data.categories.filter(c=>c&&typeof c.name==='string'&&typeof c.color==='string').map(c=>({name:c.name.trim(),color:c.color})).filter(c=>c.name);
            if(!importedNotes.length&&!importedCategories.length){alert('El archivo no contiene notas ni categorías.');return;}
            const merge=confirm('¿Combinar las notas importadas con las que ya hay en este móvil?\n\nAceptar = combinar.\nCancelar = reemplazar las notas actuales.');
            if(merge){
                const existing=new Set(notes.map(noteFingerprint));
                const additions=importedNotes.filter(n=>!existing.has(noteFingerprint(n))).map(n=>({...n,id: notes.some(old=>String(old.id)===String(n.id))?makeNoteId():n.id}));
                notes=[...notes,...additions];
                const categoryNames=new Set(categories.map(c=>c.name.toLowerCase()));
                categories=[...categories,...importedCategories.filter(c=>!categoryNames.has(c.name.toLowerCase()))];
                saveToStorage();loadManageMode();alert(`🐾 Importación terminada: ${additions.length} nota(s) añadida(s).`);
            }else{
                notes=importedNotes.map(n=>({...n,id:makeNoteId()}));
                categories=importedCategories;
                saveToStorage();loadManageMode();alert(`🐾 Importación terminada: ${notes.length} nota(s) restaurada(s).`);
            }
            renderCategories();
        }catch(error){alert('No se pudo leer ese archivo. Elige un backup .json exportado desde Neko Notes.');}
        event.target.value='';
    };
    reader.readAsText(file);
}

function formatDate(iso){const date=new Date(iso),now=new Date(),diff=now-date,mins=Math.floor(diff/60000),hours=Math.floor(diff/3600000),days=Math.floor(diff/86400000);if(mins<1)return'Ahora';if(mins<60)return`Hace ${mins} min`;if(hours<24)return`Hace ${hours}h`;if(days<7)return`Hace ${days}d`;return date.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:date.getFullYear()!==now.getFullYear()?'numeric':undefined});}
document.querySelectorAll('.mode-btn').forEach(btn=>btn.addEventListener('click',()=>switchMode(btn.dataset.mode)));
renderCategories();document.getElementById('writeArea').focus();
</script>
